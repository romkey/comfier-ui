name: comfier-ui-dev

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: comfier-ui-dev:latest
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  env_file:
    - path: .env
      required: false
  environment:
    RAILS_ENV: development
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
  # Docker Desktop's resolver doesn't forward private domains (e.g. gpu-box.lan) to your LAN DNS.
  # Set DEV_DNS in .env to your LAN DNS server so ComfyUI backends can be added by hostname.
  dns: ${DEV_DNS:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  stdin_open: true
  tty: true

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: comfier-ui-dev-postgres
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-comfier_ui_development}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USERNAME:-postgres}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.10-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "${DEV_WEB_PORT:-3000}:3000"

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      web:
        condition: service_started

  migrate:
    <<: *app
    profiles: [tools]
    command: bin/rails db:migrate

  # Stand-in ComfyUI for working without a GPU. Add a backend with URL http://fake-comfyui:8188
  fake-comfyui:
    <<: *app
    profiles: [fake]
    depends_on: []
    command: bundle exec rackup script/fake_comfyui.ru -o 0.0.0.0 -p 8188
    ports:
      - "8188:8188"

volumes:
  bundle:
    name: comfier-ui-bundle
  postgres:
  redis:
