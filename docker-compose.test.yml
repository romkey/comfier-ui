name: comfier-ui-test

services:
  postgres:
    image: postgres:18.6-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE_TEST:-comfier_ui_test}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USERNAME:-postgres}"]
      interval: 2s
      retries: 20

  redis:
    image: redis:8.10-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: comfier-ui-dev:latest
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: test
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "bin/rails db:test:prepare && bin/rails test"

  # Browser tests that play real video: docker compose -f docker-compose.test.yml run --rm system
  # Chromium runs in its own container and loads pages from this one, so the test server listens on all
  # interfaces under the service's name. Debian's Chromium (in this image) decodes H.264.
  chrome:
    image: selenium/standalone-chromium:152.0-20260909
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 1
    healthcheck:
      # Ready, not just up: the node has to have registered before a session can start.
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q '\"ready\": *true'"]
      interval: 2s
      retries: 60

  system:
    image: comfier-ui-dev:latest
    hostname: system
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: test
      POSTGRES_HOST: postgres
      SELENIUM_REMOTE_URL: http://chrome:4444/wd/hub
      CAPYBARA_APP_HOST: system
    depends_on:
      postgres:
        condition: service_healthy
      chrome:
        condition: service_healthy
    command: bash -c "bin/rails db:test:prepare && bin/rails test:system"

  # The agent end-to-end test: docker compose -f docker-compose.test.yml run --rm e2e
  e2e:
    image: comfier-ui-dev:latest
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      E2E_REDIS_URL: redis://redis:6379/15
      PYTHONPATH: /rails/comfyui/comfier_agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      bash -c "apt-get update -qq && apt-get install --no-install-recommends -y -qq python3 python3-aiohttp >/dev/null
      && script/agent_e2e"

volumes:
  bundle:
    name: comfier-ui-bundle
