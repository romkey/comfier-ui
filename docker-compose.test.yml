name: comfier-ui-test

services:
  postgres:
    image: postgres:18.6-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE_TEST:-comfier_ui_test}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USERNAME:-postgres}"]
      interval: 2s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: comfier-ui-dev:latest
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: test
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "bin/rails db:test:prepare && bin/rails test"

volumes:
  bundle:
    name: comfier-ui-bundle
