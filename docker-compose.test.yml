name: comfier-ui-test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: comfier-ui-dev:latest
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/comfier_ui_test
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "bin/rails db:test:prepare && bin/rails test"

volumes:
  bundle:
    name: comfier-ui-bundle
