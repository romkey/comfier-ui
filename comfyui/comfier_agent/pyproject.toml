[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comfier-agent"
dynamic = ["version"]
description = "Comfier managed worker agent for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
# ComfyUI already ships aiohttp; a standalone install needs it.
dependencies = ["aiohttp>=3.9"]

[project.scripts]
comfier-agent = "comfier_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "comfier_agent.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["comfier_agent*"]

[project.optional-dependencies]
preview = ["numpy>=1.24", "pillow>=10.0", "trimesh>=4.0"]
# Native Apple Silicon image generation (the mflux engine).
mflux = ["mflux>=0.22"]
# Everything a Mac needs: mflux, and 3D previews. (mlx-video installs from GitHub; see the README.)
mac = ["mflux>=0.22", "numpy>=1.24", "pillow>=10.0", "trimesh>=4.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "aiohttp>=3.9", "jsonschema>=4.18", "numpy>=1.24", "pillow>=10.0",
        "trimesh>=4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
