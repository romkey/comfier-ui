sd_image:
  name: SD 1.5
  kind: image
  description: Quick and simple
  position: 0
  base_resolution: 512
  graph:
    '3':
      class_type: KSampler
      inputs:
        seed: '{{seed}}'
        steps: 20
        model: ['4', 0]
        positive: ['6', 0]
        negative: ['7', 0]
        latent_image: ['5', 0]
    '4':
      class_type: CheckpointLoaderSimple
      inputs:
        ckpt_name: v1-5-pruned-emaonly-fp16.safetensors
    '5':
      class_type: EmptyLatentImage
      inputs:
        width: '{{width}}'
        height: '{{height}}'
        batch_size: 1
    '6':
      class_type: CLIPTextEncode
      inputs:
        text: '{{prompt}}'
        clip: ['4', 1]
    '7':
      class_type: CLIPTextEncode
      inputs:
        text: '{{negative_prompt}}'
        clip: ['4', 1]
    '9':
      class_type: SaveImage
      inputs:
        filename_prefix: comfier
        images: ['8', 0]

sdxl_image:
  name: SDXL
  kind: image
  description: Slower, more detailed
  position: 1
  base_resolution: 1024
  graph:
    '1':
      class_type: CLIPTextEncode
      inputs:
        text: '{{prompt}}'
    '2':
      class_type: EmptyLatentImage
      inputs:
        width: '{{width}}'
        height: '{{height}}'

retired_image:
  name: Retired
  kind: image
  enabled: false
  position: 2
  graph:
    '1':
      class_type: CLIPTextEncode
      inputs:
        text: '{{prompt}}'

wan_video:
  name: Wan
  kind: video
  base_resolution: 640
  frame_rate: 16
  graph:
    '1':
      class_type: CLIPTextEncode
      inputs:
        text: 'cinematic, {{prompt}}'
    '2':
      class_type: EmptyHunyuanLatentVideo
      inputs:
        width: '{{width}}'
        height: '{{height}}'
        length: '{{frames}}'
    '3':
      class_type: KSampler
      inputs:
        seed: '{{seed}}'

stable_audio:
  name: Stable Audio
  kind: audio
  graph:
    '1':
      class_type: CLIPTextEncode
      inputs:
        text: '{{prompt}}'
    '2':
      class_type: LyricsEncode
      inputs:
        text: '{{lyrics}}'

image_to_3d:
  name: Hunyuan3D
  kind: model_3d
  graph:
    '1':
      class_type: LoadImage
      inputs:
        image: '{{image}}'
    '2':
      class_type: KSampler
      inputs:
        seed: '{{seed}}'
