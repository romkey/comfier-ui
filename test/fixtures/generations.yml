alice_done:
  user: alice
  workflow: sd_image
  workflow_name: SD 1.5
  backend: gpu
  kind: image
  status: succeeded
  prompt: A lighthouse at dusk
  run_seconds: 28.5
  negative_prompt: blurry
  parameters: { seed: 42, aspect_ratio: '1:1', width: 512, height: 512 }
  comfy_prompt_id: done-prompt
  submitted_at: <%= 2.hours.ago.to_fs(:db) %>
  completed_at: <%= 2.hours.ago.to_fs(:db) %>
  created_at: <%= 2.hours.ago.to_fs(:db) %>

alice_running:
  user: alice
  workflow: sd_image
  workflow_name: SD 1.5
