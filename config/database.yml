# Connection details come from DATABASE_URL (set by the compose files), or from the
# individual DB_* variables when DATABASE_URL is absent.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 5 %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: comfier_ui_development

test:
  <<: *default
  database: comfier_ui_test

production:
  <<: *default
  database: comfier_ui_production
