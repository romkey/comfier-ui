# Connection details from POSTGRES_* in .env (see .env.example).
# DATABASE_URL, if set, overrides these settings (standard Rails behavior).
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 5 %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USERNAME", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DATABASE", "comfier_ui_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DATABASE_TEST", "comfier_ui_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DATABASE_PRODUCTION", "comfier_ui_production") %>
